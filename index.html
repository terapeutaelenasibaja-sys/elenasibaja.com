<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Elena Sibaja. Acompañamiento fonoaudiológico con un enfoque en evidencia y acompañamiento familiar.">

<title>Elena Sibaja | Acompañamiento fonoaudiológico</title>

<style>
:root{
  --black:#151515;
  --red:#b00020;
  --white:#ffffff;
  --gray:#666666;
  --light:#f5f5f5;
  --line:#dedede;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--black);
  background:var(--white);
  line-height:1.65;
}

img{
  max-width:100%;
  display:block;
}

a{
  color:inherit;
}

.container{
  width:min(1160px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

.nav{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
}

.brand img{
  width:155px;
  height:auto;
}

nav{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
}

nav a{
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-7px;
  width:0;
  height:2px;
  background:var(--red);
  transition:.25s ease;
}

nav a:hover::after,
nav a:focus::after{
  width:100%;
}

/* HERO */

.hero{
  padding:90px 0 100px;
  border-bottom:1px solid var(--line);
}

.hero-grid{
  display:grid;
  grid-template-columns:1fr .82fr;
  gap:80px;
  align-items:center;
}

.eyebrow{
  color:var(--red);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:12px;
  font-weight:bold;
}

h1{
  font-size:clamp(45px,6vw,78px);
  line-height:1.02;
  letter-spacing:-.035em;
  margin:18px 0 28px;
  max-width:760px;
}

.hero-copy{
  max-width:650px;
  font-size:19px;
  color:#444;
}

.actions{
  margin-top:30px;
}

.button{
  display:inline-block;
  padding:14px 23px;
  margin:0 10px 10px 0;
  text-decoration:none;
  font-weight:bold;
  border:1px solid var(--black);
  background:var(--black);
  color:var(--white);
  transition:.2s ease;
}

.button:hover,
.button:focus{
  background:var(--red);
  border-color:var(--red);
}

.button.secondary{
  background:var(--white);
  color:var(--black);
}

.button.secondary:hover,
.button.secondary:focus{
  background:var(--red);
  color:var(--white);
}

.hero-photo{
  position:relative;
}

.hero-photo img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  object-position:center;
}

.hero-photo::after{
  content:"";
  position:absolute;
  width:72px;
  height:72px;
  right:-18px;
  bottom:-18px;
  background:var(--red);
  z-index:-1;
}

/* SECTIONS */

section{
  padding:100px 0;
  border-bottom:1px solid var(--line);
}

h2{
  font-size:clamp(34px,4vw,54px);
  line-height:1.08;
  letter-spacing:-.025em;
  margin:12px 0 24px;
  max-width:850px;
}

h3{
  font-size:22px;
  line-height:1.25;
  margin:0 0 14px;
}

p{
  font-size:17px;
}

.intro{
  max-width:760px;
  color:#4d4d4d;
}

/* ABOUT */

.about-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:80px;
  align-items:center;
}

.about-copy p{
  color:#4b4b4b;
}

.about-panel{
  background:var(--black);
  color:var(--white);
  padding:50px;
  min-height:360px;
  display:flex;
  align-items:flex-end;
}

.about-panel strong{
  display:block;
  font-size:clamp(34px,4vw,52px);
  line-height:1.04;
}

.about-panel span{
  display:block;
  margin-top:22px;
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#ddd;
}

/* SERVICES */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:50px;
}

.card{
  border:1px solid var(--line);
  padding:34px;
  min-height:310px;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#999;
}

.card-number{
  color:var(--red);
  font-size:11px;
  font-weight:bold;
  letter-spacing:.16em;
  margin-bottom:42px;
}

.card p{
  color:#555;
  font-size:16px;
}

/* BLOG */

.blog-intro{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:40px;
}

.blog-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:50px;
}

.article{
  border:1px solid var(--line);
  background:var(--white);
  display:flex;
  flex-direction:column;
}

.article-top{
  background:var(--black);
  color:var(--white);
  min-height:150px;
  padding:28px;
  display:flex;
  align-items:flex-end;
}

.article-number{
  color:#fff;
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.article-content{
  padding:30px;
  flex:1;
  display:flex;
  flex-direction:column;
}

.article-content p{
  color:#555;
  font-size:15px;
}

.article-link{
  display:inline-block;
  margin-top:auto;
  padding-top:18px;
  color:var(--red);
  text-decoration:none;
  font-weight:bold;
}

/* RESOURCES */

.resources-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:50px;
}

.resource{
  border:1px solid var(--line);
  padding:34px;
  min-height:300px;
}

.resource-label{
  color:var(--red);
  font-size:11px;
  font-weight:bold;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:40px;
}

.resource p{
  color:#555;
  font-size:15px;
}

.resource-status{
  display:inline-block;
  margin-top:18px;
  padding:9px 13px;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:bold;
}

/* CONTACT */

.contact{
  background:var(--black);
  color:var(--white);
  border-bottom:none;
}

.contact .eyebrow{
  color:var(--white);
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr .8fr;
  gap:80px;
  align-items:center;
}

.contact p{
  color:#ddd;
  max-width:620px;
}

.contact-links{
  display:grid;
  gap:12px;
}

.contact-links a{
  display:block;
  padding:15px 18px;
  border:1px solid #555;
  text-decoration:none;
  transition:.2s ease;
}

.contact-links a:hover,
.contact-links a:focus{
  background:var(--red);
  border-color:var(--red);
}

.contact-links .primary{
  background:var(--white);
  color:var(--black);
  border-color:var(--white);
  font-weight:bold;
}

/* FOOTER */

footer{
  padding:35px 0;
}

.footer-grid{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
  flex-wrap:wrap;
}

.footer-logo{
  width:150px;
}

.footer-text{
  color:#666;
  font-size:13px;
}

/* MOBILE */

@media(max-width:850px){

  .nav{
    flex-direction:column;
    align-items:flex-start;
    padding:18px 0;
  }

  nav{
    gap:12px 18px;
  }

  .hero{
    padding:65px 0 75px;
  }

  .hero-grid,
  .about-grid,
  .contact-grid{
    grid-template-columns:1fr;
    gap:40px;
  }

  .hero-photo img{
    aspect-ratio:4/5;
  }

  .cards,
  .blog-list,
  .resources-grid{
    grid-template-columns:1fr;
  }

  section{
